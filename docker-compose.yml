services:

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: employee-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - employee-data:/var/opt/mssql

  backend:
    build:
      context: ./backend
    container_name: employee-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=EmployeeManagementDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    container_name: employee-frontend
    environment:
      VITE_API_URL: "http://localhost:5000/api/employees"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes: 
  employee-data: